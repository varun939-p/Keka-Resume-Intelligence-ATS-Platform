<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Intelligence · Keka ATS</title>
  <meta name="description" content="Resume parsing, three-layer deduplication, multi-dimensional scoring and stage routing for recruiting teams.">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("ri.theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c9a24a'/%3E%3Cpath d='M8 10h16M11 16h10M14 22h4' stroke='%230f2a31' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,400..700&family=Fragment+Mono&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></symbol>
      <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-plug" viewBox="0 0 24 24"><path d="M12 22v-5"/><path d="M9 8V2M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></symbol>

      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
      <symbol id="i-sheet" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="i-cap" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></symbol>
      <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></symbol>
      <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m6 11 6-6 6 6"/><path d="M12 19V5"/></symbol>
      <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m18 13-6 6-6-6"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="rail" id="rail" aria-label="Primary navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M8 10h16M11 16h10M14 22h4"/></svg>
        </span>
        <span class="brand-text"><strong>Resume Intelligence</strong><span>Keka ATS</span></span>
      </div>
      <nav class="nav">
        <a href="#pipeline" data-nav="pipeline"><svg class="ic"><use href="#i-users"/></svg><span>Candidates</span><span class="nav-count mono" id="nav-count"></span></a>
        <a href="#scan" data-nav="scan"><svg class="ic"><use href="#i-layers"/></svg><span>Batch scan</span><span class="nav-live" id="nav-live" hidden></span></a>
        <a href="#jobs" data-nav="jobs"><svg class="ic"><use href="#i-briefcase"/></svg><span>Job descriptions</span></a>
        <a href="#audit" data-nav="audit"><svg class="ic"><use href="#i-list"/></svg><span>Audit log</span></a>
        <a href="#integrations" data-nav="integrations"><svg class="ic"><use href="#i-plug"/></svg><span>Integrations</span></a>
      </nav>
      <div class="rail-foot" id="rail-foot">
        <div class="rail-status"><span class="status-dot" id="engine-dot"></span><span id="engine-label">Connecting</span></div>
        <div class="rail-status"><span class="status-dot" id="sheets-dot"></span><span id="sheets-label">Google Sheets</span></div>
      </div>
    </aside>
    <div class="rail-scrim" data-action="close-rail" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" data-action="open-rail" aria-label="Open navigation"><svg class="ic"><use href="#i-menu"/></svg></button>
        <div class="topbar-title">
          <h1 id="page-title">Candidates</h1>
          <span class="topbar-meta" id="page-meta"></span>
        </div>
        <div class="topbar-actions">
          <div class="mode-switch" role="radiogroup" aria-label="Workspace mode" id="mode-switch">
            <button type="button" role="radio" data-mode="demo" aria-checked="true">Demo</button>
            <button type="button" role="radio" data-mode="live" aria-checked="false">Live</button>
          </div>
          <button class="btn btn-primary" data-action="go-scan" id="topbar-scan"><svg class="ic"><use href="#i-play"/></svg><span>Run batch scan</span></button>
          <button class="icon-btn" data-action="toggle-theme" id="theme-btn" aria-label="Switch to dark theme" data-tip="Switch theme"><svg class="ic"><use href="#i-moon"/></svg></button>
        </div>
      </header>

      <div class="mode-banner" id="mode-banner" hidden></div>

      <main class="content" id="content">
        <!-- Candidates -->
        <section class="view" id="view-pipeline" data-view="pipeline">
          <div class="view-head">
            <div class="scope">
              <button class="select-btn" data-action="menu-batch" id="scope-btn" aria-haspopup="menu"><span class="select-label">Scope</span><span id="scope-label">All batches</span><svg class="ic sm"><use href="#i-chevron-down"/></svg></button>
              <span class="scope-meta" id="scope-meta"></span>
            </div>
            <div class="view-actions">
              <button class="btn" data-action="menu-rescore" id="rescore-btn" aria-haspopup="menu" hidden><svg class="ic"><use href="#i-refresh"/></svg><span>Rescore batch</span><svg class="ic sm"><use href="#i-chevron-down"/></svg></button>
              <button class="btn" data-action="sync-sheets"><svg class="ic"><use href="#i-sheet"/></svg><span>Sync to Sheets</span></button>
              <button class="btn" data-action="menu-export" aria-haspopup="menu"><svg class="ic"><use href="#i-download"/></svg><span>Export</span><svg class="ic sm"><use href="#i-chevron-down"/></svg></button>
            </div>
          </div>

          <div class="kpis" id="kpis" aria-label="Pipeline overview"></div>
          <div class="page-error" id="pipeline-error" hidden></div>

          <div class="card table-card">
            <div class="toolbar">
              <label class="search">
                <svg class="ic"><use href="#i-search"/></svg>
                <input id="search" type="search" placeholder="Search candidates" aria-label="Search candidates" autocomplete="off">
                <kbd>/</kbd>
              </label>
              <div class="stage-tabs" id="stage-tabs" role="tablist" aria-label="Filter by stage"></div>
              <div class="toolbar-right">
                <button class="select-btn" data-action="menu-minscore" id="minscore-btn" aria-haspopup="menu"><span class="select-label">Fit</span><span id="minscore-label">Any</span><svg class="ic sm"><use href="#i-chevron-down"/></svg></button>
                <button class="select-btn" data-action="menu-sort" id="sort-btn" aria-haspopup="menu"><span class="select-label">Sort</span><span id="sort-label">Overall fit</span><svg class="ic sm"><use href="#i-chevron-down"/></svg></button>
              </div>
            </div>
            <div class="bulkbar" id="bulkbar" hidden></div>
            <div class="table-wrap">
              <table class="grid" id="cand-table">
                <thead>
                  <tr>
                    <th class="col-check"><input type="checkbox" id="check-all" aria-label="Select all candidates"></th>
                    <th class="col-name"><button class="th-sort" data-sort="name">Candidate</button></th>
                    <th class="col-fit"><button class="th-sort" data-sort="overall">Role fit</button></th>
                    <th class="col-num"><button class="th-sort" data-sort="technical" data-tip="Technical skills match">Tech</button></th>
                    <th class="col-num"><button class="th-sort" data-sort="experience" data-tip="Experience and seniority alignment">Exp</button></th>
                    <th class="col-num hide-md"><button class="th-sort" data-sort="impact" data-tip="Project and impact depth">Impact</button></th>
                    <th class="col-num hide-md"><button class="th-sort" data-sort="education" data-tip="Education and JD keyword alignment">Edu</button></th>
                    <th class="col-skills hide-sm hide-lg">Critical skills</th>
                    <th class="col-dedup hide-sm"><span data-tip="File hash · Contact hash · Semantic similarity">Dedup</span></th>
                    <th class="col-stage"><button class="th-sort" data-sort="stage">Stage</button></th>
                  </tr>
                </thead>
                <tbody id="cand-body"></tbody>
              </table>
            </div>
            <div class="table-foot" id="table-foot"></div>
          </div>

          <div class="panels">
            <div class="card panel">
              <div class="panel-head">
                <h2>Fit distribution</h2>
                <span class="panel-meta" id="dist-meta"></span>
              </div>
              <div id="distribution" class="distribution"></div>
            </div>
            <div class="card panel">
              <div class="panel-head">
                <h2>Top critical gaps</h2>
                <span class="panel-meta">Unique candidates missing it</span>
              </div>
              <div id="gaps"></div>
            </div>
          </div>
        </section>

        <!-- Batch scan -->
        <section class="view" id="view-scan" data-view="scan" hidden>
          <div class="scan-grid">
            <div class="scan-config" id="scan-config"></div>
            <div class="card run-card" id="run-card"></div>
          </div>
        </section>

        <!-- Job descriptions -->
        <section class="view" id="view-jobs" data-view="jobs" hidden>
          <div class="jobs-grid">
            <div class="card jobs-list" id="jobs-list"></div>
            <div class="card jobs-editor" id="jobs-editor"></div>
          </div>
        </section>

        <!-- Audit log -->
        <section class="view" id="view-audit" data-view="audit" hidden>
          <div class="card">
            <div class="toolbar">
              <button class="select-btn" data-action="menu-audit-filter" aria-haspopup="menu"><span class="select-label">Events</span><span id="audit-filter-label">All events</span><svg class="ic sm"><use href="#i-chevron-down"/></svg></button>
              <span class="toolbar-meta" id="audit-meta"></span>
              <div class="toolbar-right">
                <button class="btn" data-action="download-audit-csv"><svg class="ic"><use href="#i-download"/></svg><span>CSV</span></button>
                <button class="btn" data-action="download-audit-json"><svg class="ic"><use href="#i-download"/></svg><span>JSON</span></button>
              </div>
            </div>
            <div class="table-wrap">
              <table class="grid audit-grid">
                <thead><tr><th>Time</th><th>Event</th><th>Candidate</th><th class="hide-sm">Detail</th><th class="col-num hide-sm">Fit</th><th class="hide-md">Actor</th></tr></thead>
                <tbody id="audit-body"></tbody>
              </table>
            </div>
            <div class="table-foot" id="audit-foot"></div>
          </div>
        </section>

        <!-- Integrations -->
        <section class="view" id="view-integrations" data-view="integrations" hidden>
          <div class="settings-grid" id="settings-grid"></div>
        </section>
      </main>
    </div>
  </div>

  <div class="drawer-scrim" id="drawer-scrim" data-action="close-drawer" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="menu" id="menu" role="menu" hidden></div>

  <dialog class="dialog compare-dialog" id="compare-dialog" aria-labelledby="compare-title">
    <div class="compare-head">
      <h2 id="compare-title">Compare candidates</h2>
      <span class="compare-meta" id="compare-meta"></span>
      <button type="button" class="icon-btn" data-action="close-compare" aria-label="Close comparison"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="compare-body" id="compare-body"></div>
  </dialog>

  <dialog class="dialog" id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="dialog-actions">
        <button class="btn" value="cancel" type="submit">Cancel</button>
        <button class="btn btn-danger" value="confirm" type="submit" id="confirm-ok">Confirm</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="pick-folder" webkitdirectory directory multiple hidden>
  <input type="file" id="pick-files" accept=".pdf,.docx,.txt,.md" multiple hidden>
  <input type="file" id="pick-jd" accept=".txt,.md,.pdf,.docx" hidden>

  <script src="/static/app.js" defer></script>
</body>
</html>
